<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Pocket Tutor 3.8 (v2.1)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; background-color: #090d16; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }
    .live-pulse { animation: pulse-ring 2s infinite; }
  </style>
</head>
<body class="min-h-screen pb-32">

  <!-- Top Bar -->
  <header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">3.8</div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="font-bold text-sm leading-tight">Pocket Tutor</h1>
          <button onclick="location.reload(true)" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-indigo-300 border border-slate-700" title="Reload App">v2.1 ↻</button>
        </div>
        <p class="text-[10px] text-slate-400">Flash 3.8 High • Live 3.8 Voice</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" onclick="switchTab('vault')" class="px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-[11px] font-medium text-indigo-300">
        🧠 Vault
      </button>
      <button type="button" id="configBtn" onclick="toggleSettings()" class="px-3 py-1.5 rounded-lg bg-indigo-600/20 border border-indigo-500/50 text-xs font-semibold text-indigo-200 flex items-center gap-1.5 active:scale-95">
        <span id="keyStatusDot" class="w-2 h-2 rounded-full bg-red-500"></span>
        <span>Config</span>
      </button>
    </div>
  </header>

  <!-- Settings Modal (Pure inline display control so it never fails) -->
  <div id="settingsModal" style="display: none;" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
        <h3 class="font-bold text-base text-white">API & Gemini 3.8 Config</h3>
        <button type="button" onclick="toggleSettings()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold">✕ Close</button>
      </div>

      <div class="space-y-1">
        <label class="text-xs font-medium text-slate-300">Gemini API Key (Stored on Phone Only)</label>
        <input id="apiKeyInput" type="password" placeholder="AIzaSy..."
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div class="space-y-1">
          <label class="text-[11px] font-medium text-slate-300">Agent 1 (Reasoning)</label>
          <input id="researchModelInput" type="text" value="gemini-3.8-flash"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-xs font-mono text-indigo-300" />
        </div>
        <div class="space-y-1">
          <label class="text-[11px] font-medium text-slate-300">Thinking Effort</label>
          <select id="thinkingLevelSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white">
            <option value="high">high (Deep)</option>
            <option value="medium">medium</option>
            <option value="low">low (Fast)</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div class="space-y-1">
          <label class="text-[11px] font-medium text-slate-300">Agent 2 (Live Voice)</label>
          <input id="liveModelInput" type="text" value="gemini-3.8-live"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-xs font-mono text-emerald-300" />
        </div>
        <div class="space-y-1">
          <label class="text-[11px] font-medium text-slate-300">Voice Persona</label>
          <select id="voiceNameSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white">
            <option value="Aoede">Aoede (Warm)</option>
            <option value="Puck">Puck (Dynamic)</option>
            <option value="Kore">Kore (Calm)</option>
            <option value="Charon">Charon (Deep)</option>
          </select>
        </div>
      </div>

      <div id="testPingStatus" class="hidden text-xs p-2.5 rounded-xl border"></div>

      <div class="flex gap-2 pt-2">
        <button type="button" onclick="testApiConnection()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 font-semibold py-2.5 rounded-xl text-xs">
          ⚡ Test API Key
        </button>
        <button type="button" onclick="saveSettings()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs">
          💾 Save & Close
        </button>
      </div>
    </div>
  </div>

  <!-- Floating Live 3.8 Voice Session Bar -->
  <div id="liveSessionBar" style="display: none;" class="fixed bottom-0 inset-x-0 z-40 bg-slate-900/95 backdrop-blur-lg border-t border-indigo-500/40 p-3 shadow-2xl">
    <div class="max-w-xl mx-auto flex flex-col gap-2">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
